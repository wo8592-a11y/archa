name: Android Build & APK Generator

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # GitHub 웹 UI에서 'Run workflow' 버튼을 눌러 언제든지 수동 빌드 가능

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper Exists
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar not found, fetching wrapper..."
            curl -fL -s "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar || true
            if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
              echo "Downloading gradle zip to extract wrapper..."
              curl -fL -s "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -o gradle-tmp.zip
              unzip -q -j gradle-tmp.zip "*/lib/gradle-wrapper-*.jar" -d gradle/wrapper/
              mv gradle/wrapper/gradle-wrapper-*.jar gradle/wrapper/gradle-wrapper.jar
              rm -f gradle-tmp.zip
            fi
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Generated APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          echo "Generated APK: $APK_FILE"

      - name: Upload Debug APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wo8592-webview-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
