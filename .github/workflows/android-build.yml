name: Android Build & APK Generator

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      GRADLE_VERSION: "8.7"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle Wrapper
        run: |
          chmod +x gradlew
          mkdir -p gradle/wrapper
          
          # Gradle 배포본 다운로드 후 wrapper.jar 추출
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
               -O /tmp/gradle-bin.zip
          
          # 여러 경로 패턴 시도
          unzip -q /tmp/gradle-bin.zip -d /tmp/gradle-dist/
          
          # gradle-wrapper.jar 를 lib 폴더에서 찾기
          WRAPPER_JAR=$(find /tmp/gradle-dist/ -name "gradle-wrapper*.jar" 2>/dev/null | head -n 1)
          
          if [ -n "$WRAPPER_JAR" ] && [ -s "$WRAPPER_JAR" ]; then
            cp "$WRAPPER_JAR" gradle/wrapper/gradle-wrapper.jar
            echo "✅ gradle-wrapper.jar 복사 성공: $WRAPPER_JAR ($(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes)"
          else
            echo "❌ zip에서 추출 실패, Gradle binary 직접 사용..."
            /tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
                --gradle-version ${GRADLE_VERSION} \
                --project-dir .
          fi
          
          ls -lh gradle/wrapper/

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        run: |
          find app/build/outputs/ -name "*.apk" | while read apk; do
            echo "APK: $apk"
            ls -lh "$apk"
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wo8592-webview-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
